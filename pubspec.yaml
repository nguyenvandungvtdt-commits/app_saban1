name: flutter_application_2
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  http: ^1.2.0 # Thêm dòng này
  image_picker: ^1.1.2 # Chọn ảnh từ thư viện thiết bị
  file_picker: ^13.1.0  # Chọn file Excel/JSON trực tiếp từ máy (nếu muốn)
  path_provider: ^2.1.0 # 🟢 Thêm package này
  dio: ^5.4.0           # 🟢 Thêm package này nếu dùng FirmwareService
  logger: ^2.8.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  media_scanner: ^2.2.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1  # Thêm dòng này
  flutter_lints: ^6.0.0
# The following section is specific to Flutter packages.
flutter_launcher_icons:
  android: true
  ios: true                           # Bắt buộc là true để hỗ trợ iOS
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true               # NÊN THÊM: Xóa kênh Alpha (nền trong suốt) để tránh lỗi App Store
# Cấu hình tự động cho Android (Adaptive Icons từ Android 8.0 trở lên)
  adaptive_icon_background: "#FFFFFF" # Tự động tạo màu nền (ví dụ: mã màu Hex trắng, hoặc đường dẫn file ảnh nền)
  adaptive_icon_foreground: "assets/images/icon.png" # Ảnh logo chính ở giữa
flutter:
  uses-material-design: true
  assets:
    - assets/images/overview.jpg
    - assets/images/building.jpg
    - assets/images/floor.jpg
    - assets/images/room.jpg
    - assets/images/background.png
    - assets/images/icon.png          # 👈 THÊM DÒNG NÀY VÀO
